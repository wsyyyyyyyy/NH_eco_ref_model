<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERM Portal — 내부 인증</title>
    <meta name="description" content="경제참조모델(ERM) AI 신용평가 포탈 — 직원 내부 인증 시스템">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --bg-dark: #0f0f1a;
            --bg-card: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background ── */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(99, 102, 241, 0.15), transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 70%, rgba(139, 92, 246, 0.1), transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(6, 182, 212, 0.05), transparent 70%);
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(99, 102, 241, 0.2);
            top: -10%; left: -5%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: rgba(139, 92, 246, 0.15);
            bottom: -10%; right: -5%;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: rgba(6, 182, 212, 0.12);
            top: 50%; left: 60%;
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(10px, -10px) scale(1.02); }
        }

        /* ── Login Container ── */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 0 24px;
        }

        /* ── Brand Header ── */
        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3); }
            50%      { box-shadow: 0 8px 48px rgba(99, 102, 241, 0.5); }
        }

        .brand-icon svg {
            width: 32px;
            height: 32px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ── Glass Card ── */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .login-card-header {
            margin-bottom: 32px;
        }

        .login-card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .login-card-header p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.06);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary-light);
        }

        .form-input.error {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.06);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%  { transform: translateX(-6px); }
            40%  { transform: translateX(6px); }
            60%  { transform: translateX(-4px); }
            80%  { transform: translateX(4px); }
        }

        /* ── Error Message ── */
        .error-message {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #fca5a5;
            font-weight: 500;
        }

        .error-message.visible {
            display: flex;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .error-message svg {
            flex-shrink: 0;
        }

        /* ── Submit Button ── */
        .btn-login {
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .spinner { display: inline-block; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 28px;
        }

        .login-footer p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.6;
        }

        .login-footer .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.12);
            border-radius: 20px;
            font-size: 11px;
            color: #6ee7b7;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
            }
            .brand-title {
                font-size: 24px;
            }
            .login-wrapper {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Login Content -->
    <div class="login-wrapper">
        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <svg fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="brand-title">ERM AI Portal</h1>
            <p class="brand-subtitle">경제참조모델 신용평가 시스템 · 내부 전용</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-card-header">
                <h2>🔐 내부 인증</h2>
                <p>ERM 포탈 접속을 위한 비밀번호를 입력해 주세요.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Error Message -->
                <div class="error-message" id="errorMessage">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                    </svg>
                    <span id="errorText">정보가 올바르지 않습니다.</span>
                </div>

                <!-- ID Field -->
                <div class="form-group">
                    <label class="form-label" for="userId">Employee ID (사번)</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="userId" 
                            class="form-input" 
                            placeholder="7자리 사번을 입력하세요 (예: 1991001)"
                            autocomplete="username"
                            required
                            autofocus
                        >
                        <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label" for="password">Access Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="비밀번호를 입력하세요"
                            autocomplete="current-password"
                            required
                        >
                        <svg class="input-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">인증 후 접속</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <div class="security-badge">
                    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                    SHA-256 Encrypted Authentication
                </div>
                <p>본 시스템은 인가된 직원만 접근 가능합니다.<br>문의: 기업영업기획본부 AI리스크팀</p>
            </div>
        </div>
    </div>

    <script>
        // ── Auth Configuration ──
        // SHA-256 hash of the password "erm2026"
        const VALID_HASH = '7c39e9f15d525efc89cf8d8890d1f4ad77079d2ad15ec48ac3b1da0072f43139';
        const AUTH_KEY = 'erm_auth_token';
        const AUTH_USER_KEY = 'erm_user_profile';

        // ── Mock User Database ──
        const USER_DB = {
            '1991001': { id: '1991001', name: '김지점장', branch: '광명지점', role: 'R.M.', dept: '기업영업기획본부' },
            '2102002': { id: '2102002', name: '이수석', branch: '강남지점', role: 'Senior R.M.', dept: '기업여신심사부' },
            '2201003': { id: '2201003', name: '박행원', branch: '여의도지점', role: 'R.M.', dept: '중소기업금융센터' },
            '1992001': { id: '1992001', name: '최지점장', branch: '시장지점', role: 'R.M.', dept: '소상공인금융센터' }
        };

        // ── Check if already authenticated ──
        (function checkExistingAuth() {
            const token = sessionStorage.getItem(AUTH_KEY);
            const user = sessionStorage.getItem(AUTH_USER_KEY);
            if (token === VALID_HASH && user) {
                window.location.replace('portal.html');
            }
        })();

        // ── SHA-256 Hash Function (Web Crypto API) ──
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ── Login Handler ──
        async function handleLogin(event) {
            event.preventDefault();

            const userIdInput = document.getElementById('userId');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            const userId = userIdInput.value.trim();
            const password = passwordInput.value.trim();

            // Reset states
            userIdInput.classList.remove('error');
            passwordInput.classList.remove('error');
            errorMessage.classList.remove('visible');

            if (!userId || !password) {
                showError('사번과 비밀번호를 모두 입력해 주세요.');
                return;
            }

            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Simulate brief authentication delay for UX
            await new Promise(resolve => setTimeout(resolve, 600));

            // Hash and verify
            const inputHash = await sha256(password);
            const user = USER_DB[userId];

            if (inputHash === VALID_HASH && user) {
                // Success — store auth token and user profile
                sessionStorage.setItem(AUTH_KEY, VALID_HASH);
                sessionStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));

                // Brief success feedback before redirect
                loginBtn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;">✓ 인증 완료</span>';
                loginBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';

                await new Promise(resolve => setTimeout(resolve, 500));
                window.location.replace('portal.html');
            } else {
                // Failure
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                showError('사번 또는 비밀번호가 올바르지 않습니다.');
                if (!user) userIdInput.classList.add('error');
                if (inputHash !== VALID_HASH) passwordInput.classList.add('error');
                passwordInput.value = '';
                if (!user) userIdInput.focus();
                else passwordInput.focus();
            }
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMessage.classList.add('visible');
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
